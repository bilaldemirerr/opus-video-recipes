<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b10; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; color: #f5f5f7; }
      .bg { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 0%, #3b1d6e 0%, #0b0b10 60%); }
      .orb { position: absolute; width: 900px; height: 900px; left: 90px; top: 380px; border-radius: 50%; background: radial-gradient(circle, rgba(217,119,87,0.55), rgba(217,119,87,0) 65%); }
      .tag { position: absolute; top: 170px; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #e08a6d; }
      .card { position: absolute; left: 110px; right: 110px; top: 520px; height: 620px; border-radius: 40px; background: #15151d; border: 2px solid #2a2a36; padding: 56px; font-family: ui-monospace, Menlo, monospace; font-size: 36px; line-height: 1.6; color: #c4c4cc; white-space: pre; }
      .line { display: block; opacity: 0; }
      .k { color: #f0a080; } .s { color: #86efac; }
      .cap { position: absolute; left: 70px; right: 70px; top: 1320px; text-align: center; font-size: 84px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; opacity: 0; }
      .cap span { color: rgba(245,245,247,0.55); }
      .cap span.on { color: #ffffff; }
      .handle { position: absolute; bottom: 150px; left: 0; right: 0; text-align: center; font-size: 36px; color: #a1a1aa; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div class="bg"></div>
      <div class="orb" id="orb"></div>
      <div class="tag" id="tag">Made with Claude Opus 5.5</div>
      <div class="card" id="card"><span class="line"><span class="k">&lt;div</span> data-duration=<span class="s">"15"</span><span class="k">&gt;</span></span><span class="line">  <span class="k">&lt;audio</span> src=<span class="s">"vo.wav"</span><span class="k">/&gt;</span></span><span class="line">  <span class="k">&lt;h1&gt;</span>captions<span class="k">&lt;/h1&gt;</span></span><span class="line"><span class="k">&lt;/div&gt;</span></span><span class="line"> </span><span class="line s">$ npx hyperframes render</span><span class="line">✓ out.mp4  1080x1920</span></div>
      <div id="caps"></div>
      <div class="handle">bilallabs.vercel.app/ai/opus-video</div>
      <audio id="vo" src="assets/vo.wav" data-start="0" data-duration="14.76" data-track-index="1"></audio>
    </div>
    <script>
      const W = [["I",0.01],["made",0.06],["this",0.36],["video",0.6],["without",0.93],["opening",1.44],["a",1.87],["video",1.93],["editor.",2.26],
        ["I",2.73],["gave",2.8],["Claude",3.14],["Opus",3.66],["5.5",4.0],["one",4.6],["prompt.",5.04],
        ["It",5.63],["wrote",5.88],["HTML,",6.55],["and",7.1],["HyperFrames",7.28],["rendered",7.94],["it",8.42],["to",8.56],["MP4.",8.84],
        ["The",9.57],["captions,",9.79],["the",10.56],["voice,",10.77],["the",11.28],["motion.",11.51],["All",12.29],["local.",12.37],
        ["Here",13.01],["is",13.3],["the",13.45],["exact",13.67],["recipe.",14.09]];
      const GROUPS = [[0,5],[5,9],[9,13],[13,16],[16,19],[19,25],[25,31],[31,33],[33,38]];
      const tl = gsap.timeline({ paused: true });
      const caps = document.getElementById("caps");
      GROUPS.forEach(([a, b], gi) => {
        const el = document.createElement("div");
        el.className = "cap";
        el.id = "cap" + gi;
        W.slice(a, b).forEach(([t], i) => {
          const s = document.createElement("span");
          s.id = "w" + (a + i);
          s.textContent = t + " ";
          el.appendChild(s);
        });
        caps.appendChild(el);
        const start = W[a][1];
        const end = b < W.length ? W[b][1] : 15;
        tl.fromTo(el, { opacity: 0, y: 30, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "power2.out" }, start);
        tl.set(el, { opacity: 0 }, end - 0.01);
        for (let i = a; i < b; i++) tl.set("#w" + i, { className: "on" }, W[i][1]);
      });
      tl.fromTo("#tag", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#card", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.to("#card .line", { opacity: 1, duration: 0.3, stagger: 0.8 }, 3.0);
      tl.fromTo("#orb", { scale: 0.8, opacity: 0.6 }, { scale: 1.15, opacity: 1, duration: 15, ease: "sine.inOut" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
